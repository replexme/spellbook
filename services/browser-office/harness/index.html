<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spellbook Browser Office Conformance</title>
    <link rel="stylesheet" href="/harness/styles.css" />
  </head>
  <body data-state="booting">
    <header>
      <div>
        <strong>Spellbook Browser Office</strong>
        <span id="status" role="status" aria-live="polite">Loading engine</span>
      </div>
      <nav aria-label="Document actions">
        <label class="button" for="file-input">Open PPTX</label>
        <input id="file-input" type="file" accept=".pptx" />
        <button id="insert-slide" type="button" disabled>Add slide</button>
        <button id="undo" type="button" disabled>Undo</button>
        <button id="save" type="button" disabled>Save copy</button>
      </nav>
    </header>
    <main>
      <canvas
        id="qtcanvas"
        contenteditable="true"
        aria-label="Editable presentation canvas"
        oncontextmenu="event.preventDefault()"
      ></canvas>
      <div id="composition" role="status" aria-live="polite" hidden></div>
    </main>
    <output id="evidence" aria-label="Conformance evidence"></output>
    <script src="/runtime/browser-candidate.js"></script>
    <script type="module" src="/harness/app.js"></script>
  </body>
</html>
