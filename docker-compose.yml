name: spellbook

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spellbook
      POSTGRES_USER: spellbook
      POSTGRES_PASSWORD: ${SPELLBOOK_POSTGRES_PASSWORD:?run pnpm selfhost:setup}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spellbook -d spellbook"]
      interval: 5s
      timeout: 5s
      retries: 20

  document-worker:
    build:
      context: .
      dockerfile: services/document-worker/Dockerfile
    restart: unless-stopped
    environment:
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
    volumes:
      - document-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai-connector:
    build:
      context: .
      dockerfile: apps/ai-connector/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      SPELLBOOK_CONTRACTS_DIR: /app/contracts
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_CODEX_AUTH_DIR: /ai-auth
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_LOCAL_EMAIL: ${SPELLBOOK_LOCAL_EMAIL}
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
    volumes:
      - document-data:/data
      - ai-auth-data:/ai-auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  office-editor:
    profiles: ["wopi"]
    build:
      context: .
      dockerfile: services/office-editor/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 9980
      SPELLBOOK_OFFICE_FORWARDED_PROTO: http
      aliasgroup1: http://web:3000
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:welcome.enable=false
        --o:experimental_features=true
        --o:hide_legacy_script_warning=true
        --o:net.frame_ancestors=http://localhost:3000
        --o:storage.wopi.host[0]=web
    cap_add:
      - CHOWN
      - FOWNER
      - MKNOD
      - SYS_CHROOT
    volumes:
      - ${SPELLBOOK_WOPI_PROOF_KEY_PATH:-./.spellbook/secrets/wopi-proof-key.pem}:/etc/coolwsd/proof_key:ro
    ports:
      - "9980:9980"
    healthcheck:
      test: ["CMD", "/usr/local/bin/spellbook-office-gateway", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  browser-office:
    profiles: ["browser"]
    build:
      context: .
      dockerfile: services/browser-office/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4173
      HOST: 0.0.0.0
      SPELLBOOK_BROWSER_ENGINE: onlyoffice
      SPELLBOOK_ONLYOFFICE_DISTRIBUTION: /app/services/browser-office/onlyoffice/distribution
      SPELLBOOK_BROWSER_OFFICE_PUBLIC_URL: ${SPELLBOOK_BROWSER_OFFICE_PUBLIC_URL:-http://localhost:4173}
      SPELLBOOK_ONLYOFFICE_SDK_ORIGIN: ${SPELLBOOK_ONLYOFFICE_SDK_ORIGIN:-http://localhost:4174}
      SPELLBOOK_ONLYOFFICE_INSPECTION_ORIGIN: ${SPELLBOOK_ONLYOFFICE_INSPECTION_ORIGIN:-http://localhost:4175}
      SPELLBOOK_BROWSER_HOST_ORIGIN: ${SPELLBOOK_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "4173:4173"
      - "4174:4174"
      - "4175:4175"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${SPELLBOOK_PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://spellbook:${SPELLBOOK_POSTGRES_PASSWORD}@database:5432/spellbook
      SPELLBOOK_DB_POOL_MAX: ${SPELLBOOK_DB_POOL_MAX:-4}
      SPELLBOOK_JOB_REDELIVERY_SECONDS: ${SPELLBOOK_JOB_REDELIVERY_SECONDS:-15}
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
      SPELLBOOK_STORAGE_NAMESPACE: local
      SPELLBOOK_DOCUMENT_WORKER_URL: http://document-worker:8080
      SPELLBOOK_AI_WORKER_URL: http://ai-connector:8080
      SPELLBOOK_AI_CONNECTOR_MODE: ${SPELLBOOK_AI_CONNECTOR_MODE:-internal}
      SPELLBOOK_LOCAL_CONNECTOR_ORIGIN: ${SPELLBOOK_LOCAL_CONNECTOR_ORIGIN:-http://127.0.0.1:43127}
      SPELLBOOK_INTERNAL_APP_URL: http://web:3000
      SPELLBOOK_OFFICE_EDITOR_URL: ${SPELLBOOK_OFFICE_PUBLIC_URL:-http://localhost:9980}
      SPELLBOOK_OFFICE_EDITOR_INTERNAL_URL: http://office-editor:9980
      SPELLBOOK_EDITOR_MODE: ${SPELLBOOK_EDITOR_MODE:-browser}
      SPELLBOOK_BROWSER_OFFICE_URL: ${SPELLBOOK_BROWSER_OFFICE_PUBLIC_URL:-http://localhost:4173}
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_SESSION_SECRET: ${SPELLBOOK_SESSION_SECRET}
      SPELLBOOK_WOPI_SECRET: ${SPELLBOOK_WOPI_SECRET}
      SPELLBOOK_WOPI_PROOF_MODE: ${SPELLBOOK_WOPI_PROOF_MODE:-required}
      SPELLBOOK_LOCAL_EMAIL: ${SPELLBOOK_LOCAL_EMAIL}
      SPELLBOOK_LOCAL_PASSWORD_HASH: ${SPELLBOOK_LOCAL_PASSWORD_HASH}
    volumes:
      - document-data:/data
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      document-worker:
        condition: service_healthy
      ai-connector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  database-data:
  document-data:
  ai-auth-data:
