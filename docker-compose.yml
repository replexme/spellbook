name: spellbook

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spellbook
      POSTGRES_USER: spellbook
      POSTGRES_PASSWORD: ${SPELLBOOK_POSTGRES_PASSWORD:?run pnpm selfhost:setup}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spellbook -d spellbook"]
      interval: 5s
      timeout: 5s
      retries: 20

  document-worker:
    build:
      context: .
      dockerfile: services/document-worker/Dockerfile
    restart: unless-stopped
    environment:
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
    volumes:
      - document-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai-connector:
    build:
      context: .
      dockerfile: apps/ai-connector/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      SPELLBOOK_CONTRACTS_DIR: /app/contracts
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_CODEX_AUTH_DIR: /ai-auth
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_LOCAL_EMAIL: ${SPELLBOOK_LOCAL_EMAIL}
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
    volumes:
      - document-data:/data
      - ai-auth-data:/ai-auth
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  document-view:
    build:
      context: .
      dockerfile: services/document-view/Dockerfile
      args:
        SPELLBOOK_APP_ORIGIN: ${SPELLBOOK_PUBLIC_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "4173:4173"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:4173/readyz.json",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${SPELLBOOK_PUBLIC_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://spellbook:${SPELLBOOK_POSTGRES_PASSWORD}@database:5432/spellbook
      SPELLBOOK_DB_POOL_MAX: ${SPELLBOOK_DB_POOL_MAX:-4}
      SPELLBOOK_JOB_REDELIVERY_SECONDS: ${SPELLBOOK_JOB_REDELIVERY_SECONDS:-15}
      SPELLBOOK_DATA_DIR: /data
      SPELLBOOK_STORAGE_RESERVE_BYTES: ${SPELLBOOK_STORAGE_RESERVE_BYTES:-536870912}
      SPELLBOOK_STORAGE_NAMESPACE: local
      SPELLBOOK_DOCUMENT_WORKER_URL: http://document-worker:8080
      SPELLBOOK_AI_WORKER_URL: http://ai-connector:8080
      SPELLBOOK_AI_CONNECTOR_MODE: ${SPELLBOOK_AI_CONNECTOR_MODE:-internal}
      SPELLBOOK_LOCAL_CONNECTOR_ORIGIN: ${SPELLBOOK_LOCAL_CONNECTOR_ORIGIN:-http://127.0.0.1:43127}
      SPELLBOOK_INTERNAL_APP_URL: http://web:3000
      # The document view's public address (the browser loads it).
      SPELLBOOK_BROWSER_OFFICE_URL: ${SPELLBOOK_DOCUMENT_VIEW_PUBLIC_URL:-http://localhost:4173}
      SPELLBOOK_INTERNAL_TOKEN: ${SPELLBOOK_INTERNAL_TOKEN}
      SPELLBOOK_SESSION_SECRET: ${SPELLBOOK_SESSION_SECRET}
      # Signs the AI job capability tokens (historical name).
      SPELLBOOK_WOPI_SECRET: ${SPELLBOOK_WOPI_SECRET}
      SPELLBOOK_LOCAL_EMAIL: ${SPELLBOOK_LOCAL_EMAIL}
      SPELLBOOK_LOCAL_PASSWORD_HASH: ${SPELLBOOK_LOCAL_PASSWORD_HASH}
    volumes:
      - document-data:/data
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      document-worker:
        condition: service_healthy
      ai-connector:
        condition: service_healthy
      document-view:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  database-data:
  document-data:
  ai-auth-data:
