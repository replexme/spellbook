<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The browser engine ships Noto Sans KR only. The server editor's rules
     name Noto Sans CJK KR (the same design and advance widths) and Malgun
     Gothic; both, and every other Korean face, resolve to it here. -->
<fontconfig>
  <alias binding="weak">
    <family>Noto Sans CJK KR</family>
    <prefer><family>Noto Sans KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Noto Serif CJK KR</family>
    <prefer><family>Noto Sans KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>Malgun Gothic</family>
    <prefer><family>Noto Sans KR</family></prefer>
  </alias>
  <alias binding="weak">
    <family>맑은 고딕</family>
    <prefer><family>Noto Sans KR</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append_last" binding="weak">
      <string>Noto Sans KR</string>
    </edit>
  </match>
  <alias binding="weak">
    <family>sans-serif</family>
    <accept><family>Noto Sans KR</family></accept>
  </alias>
</fontconfig>
