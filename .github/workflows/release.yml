name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-render-analysis.txt
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - run: python -m pip install --requirement scripts/requirements-render-analysis.txt
      - run: python -m pip install 'reuse[charset-normalizer]==6.2.0'
      - run: pnpm install --frozen-lockfile
      - run: reuse lint
      - run: pnpm verify
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Generate source SPDX SBOM
        run: |
          mkdir -p release-assets
          "${{ steps.syft.outputs.cmd }}" scan dir:. \
            --exclude './.git/**' \
            --source-name spellbook-source \
            --source-version "$GITHUB_SHA" \
            --output "spdx-json=release-assets/spellbook-source-${GITHUB_SHA}.spdx.json"
      - name: Verify source SPDX SBOM
        run: >-
          node scripts/verify-release-sbom.mjs
          "release-assets/spellbook-source-${GITHUB_SHA}.spdx.json"
          spellbook-source "$GITHUB_SHA" source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-source
          path: release-assets/*.spdx.json
          if-no-files-found: error
          retention-days: 90

  runtime-sboms:
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: ai-connector
            dockerfile: apps/ai-connector/Dockerfile
          - name: document-worker
            dockerfile: services/document-worker/Dockerfile
          - name: office-editor
            dockerfile: services/office-editor/Dockerfile
          - name: browser-office
            dockerfile: services/browser-office/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release runtime image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
          --tag "spellbook-${{ matrix.name }}:${GITHUB_SHA}"
          .
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Generate runtime SPDX SBOM
        run: |
          mkdir -p release-assets
          "${{ steps.syft.outputs.cmd }}" scan "docker:spellbook-${{ matrix.name }}:${GITHUB_SHA}" \
            --source-name "spellbook-${{ matrix.name }}" \
            --source-version "$GITHUB_REF_NAME" \
            --output "spdx-json=release-assets/spellbook-${{ matrix.name }}-${GITHUB_SHA}.spdx.json"
      - name: Verify runtime SPDX SBOM
        run: >-
          node scripts/verify-release-sbom.mjs
          "release-assets/spellbook-${{ matrix.name }}-${GITHUB_SHA}.spdx.json"
          "spellbook-${{ matrix.name }}" "$GITHUB_REF_NAME" image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.name }}
          path: release-assets/*.spdx.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [verify-source, runtime-sboms]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sbom-*
          path: release-assets
          merge-multiple: true
      - name: Checksum and publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum release-assets/*.spdx.json | sort -k2 > release-assets/SHA256SUMS
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --verify-tag \
              --title "Spellbook ${tag}" \
              --generate-notes
          fi
